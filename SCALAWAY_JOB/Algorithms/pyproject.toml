[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soil-algorithms"
version = "0.1.0"
description = "Soil texture prediction pipeline using Sentinel-2 data"
authors = [
    {name = "Ibrahim", email = "ibrahim@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "openpyxl>=3.0.0",
    "joblib>=1.0.0",
    "boto3>=1.20.0",
    "python-dotenv>=0.19.0",
    "pyyaml>=6.0",
    "tqdm>=4.60.0",
    "seaborn>=0.11.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.900"
]

[tool.setuptools.packages.find]
where = ["src"]
