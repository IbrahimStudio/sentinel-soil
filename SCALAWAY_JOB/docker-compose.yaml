services:

  # ---------------------------------------------------------------------------
  # Local S3 emulator — only started with: docker compose --profile local ...
  # MinIO data persists in ./local_storage/ between restarts
  # Console UI: http://localhost:9001  (user: minioadmin / minioadmin)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    profiles: [local]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./local_storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio_init:
    image: minio/mc:latest
    profiles: [local]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/soil-sentinel --ignore-existing;
      echo 'Bucket soil-sentinel ready';
      "
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Job 1 – Remote Sensing Data Acquisition
  # Reads gabri_filters.xlsx, calls Sentinel Hub Statistics API, stores to S3
  # ---------------------------------------------------------------------------
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    image: rg.fr-par.scw.cloud/soil-sentinel/ingestion:latest
    command:
      - python
      - main.py
      - --xlsx
      - /data/input.xlsx
      - --evalscript_path
      - ${EVALSCRIPT:-sh_statistics/evalscripts/only_scl.js}
      - --time_window
      - "${TIME_WINDOW:-}"
      - --start_date
      - "${START_DATE:-}"
      - --end_date
      - "${END_DATE:-}"
      - --workers
      - "${WORKERS:-8}"
      - --ndvi_threshold
      - "${NDVI_THRESHOLD:-0.2}"
      - --coverage_threshold
      - "${COVERAGE_THRESHOLD:-0.8}"
      - --limit
      - "${LIMIT:--1}"
      - --storage_prefix
      - "${STORAGE_PREFIX:-batch_results/{ts}}"
    volumes:
      - ${XLSX:-./gabri_filters.xlsx}:/data/input.xlsx:ro
    env_file: .env
    environment:
      # SH credentials come from env_file — do NOT repeat them here or an empty
      # shell variable silently overrides the .env value with a blank string.
      SCALEWAY_S3_ENDPOINT: ${SCALEWAY_S3_ENDPOINT}
      SCALEWAY_S3_REGION: ${SCALEWAY_S3_REGION:-fr-par}
      SCALEWAY_S3_BUCKET: ${SCALEWAY_S3_BUCKET}
      SCALEWAY_ACCESS_KEY: ${SCALEWAY_ACCESS_KEY}
      SCALEWAY_SECRET_KEY: ${SCALEWAY_SECRET_KEY}

  # ---------------------------------------------------------------------------
  # Job 2 – Data Enrichment & Feature Consolidation
  # Reads aggregated S3 JSONs, joins with labels, writes feature parquet
  # ---------------------------------------------------------------------------
  feature_store:
    build:
      context: .
      dockerfile: feature_store/Dockerfile
    image: rg.fr-par.scw.cloud/soil-sentinel/feature-store:latest
    command:
      - python
      - main.py
      - --prefix
      - ${FEATURE_STORE_PREFIX:-batch_results/aggregated/}
      - --labels
      - /data/gabri_filters.xlsx
      - --output
      - /output/features.parquet
    volumes:
      - ./gabri_filters.xlsx:/data/gabri_filters.xlsx:ro
      - ./feature_store/output:/output
    env_file: .env
    environment:
      SCALEWAY_S3_ENDPOINT: ${SCALEWAY_S3_ENDPOINT}
      SCALEWAY_S3_REGION: ${SCALEWAY_S3_REGION:-fr-par}
      SCALEWAY_S3_BUCKET: ${SCALEWAY_S3_BUCKET}
      SCALEWAY_ACCESS_KEY: ${SCALEWAY_ACCESS_KEY}
      SCALEWAY_SECRET_KEY: ${SCALEWAY_SECRET_KEY}

  # ---------------------------------------------------------------------------
  # Job 3 – Model Training & Evaluation
  # Loads feature table, trains regressors, writes reports/
  # ---------------------------------------------------------------------------
  training:
    build:
      context: .
      dockerfile: training/Dockerfile
    image: rg.fr-par.scw.cloud/soil-sentinel/training:stats-api
    command:
      - python
      - main.py
      - --features
      - /data/features.parquet
      - --target
      - ${TARGET:-all}
      - --pipeline
      - ${PIPELINE_VERSION:-v2}
      - --reports-dir
      - /reports
    volumes:
      - ./feature_store/output:/data:ro
      - ./training/reports:/reports
    env_file: .env
    environment:
      TARGET: ${TARGET:-Clay}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-v2}

  # ---------------------------------------------------------------------------
  # v2 Pipeline — Process API (raw rasters → center-pixel medians → all 4 targets)
  # Run with: make local-v2
  # ---------------------------------------------------------------------------

  ingestion_process_api:
    profiles: [v2]
    build:
      context: .
      dockerfile: ingestion/process_api/Dockerfile
    image: rg.fr-par.scw.cloud/soil-sentinel/ingestion:process-api
    command:
      - python
      - main.py
      - --xlsx
      - /data/input.xlsx
      - --evalscript
      - /data/evalscript.js
      - --time-window-days
      - "${TIME_WINDOW_DAYS:-365}"
      - --start-date
      - "${START_DATE:-}"
      - --end-date
      - "${END_DATE:-}"
      - --workers
      - "${WORKERS:-8}"
      - --raster-prefix
      - "${RASTER_PREFIX:-raw_rasters/}"
      - --limit
      - "${LIMIT:--1}"
      - --evalscript-mt
      - /data/evalscript_mt.js
      - --season-months
      - "${SEASON_MONTHS:-}"
    volumes:
      - ./gabri_filters.xlsx:/data/input.xlsx:ro
      - ../DSM_WEBAPP/evalscript_process_api.js:/data/evalscript.js:ro
      - ../DSM_WEBAPP/evalscript_multitemporal.js:/data/evalscript_mt.js:ro
    env_file: .env
    environment:
      # SH credentials come from env_file only — see comment on ingestion service.
      SCALEWAY_S3_ENDPOINT: ${SCALEWAY_S3_ENDPOINT}
      SCALEWAY_S3_BUCKET: ${SCALEWAY_S3_BUCKET}
      SCALEWAY_ACCESS_KEY: ${SCALEWAY_ACCESS_KEY}
      SCALEWAY_SECRET_KEY: ${SCALEWAY_SECRET_KEY}

  coverage_report:
    profiles: [v2]
    image: rg.fr-par.scw.cloud/soil-sentinel/feature-store:latest
    command:
      - python
      - coverage_report.py
      - --xlsx
      - /data/input.xlsx
      - --filter-config
      - /config/filter_config.json
      - --raster-prefix
      - "${RASTER_PREFIX:-raw_rasters/}"
      - --output-dir
      - /reports/coverage
      - --limit
      - "${LIMIT:--1}"
    volumes:
      - ./gabri_filters.xlsx:/data/input.xlsx:ro
      - ../DSM_WEBAPP/filter_config.json:/config/filter_config.json:ro
      - ./training/reports:/reports
    env_file: .env
    environment:
      SCALEWAY_S3_ENDPOINT: ${SCALEWAY_S3_ENDPOINT}
      SCALEWAY_S3_BUCKET: ${SCALEWAY_S3_BUCKET}
      SCALEWAY_ACCESS_KEY: ${SCALEWAY_ACCESS_KEY}
      SCALEWAY_SECRET_KEY: ${SCALEWAY_SECRET_KEY}

  feature_store_v2:
    profiles: [v2]
    image: rg.fr-par.scw.cloud/soil-sentinel/feature-store:latest
    command:
      - python
      - main.py
      - --source
      - process_api
      - --labels
      - /data/input.xlsx
      - --filter-config
      - /data/filter_config.json
      - --raster-prefix
      - "${RASTER_PREFIX:-raw_rasters/}"
      - --output
      - /output/features_v2.parquet
    volumes:
      - ./gabri_filters.xlsx:/data/input.xlsx:ro
      - ../DSM_WEBAPP/filter_config.json:/data/filter_config.json:ro
      - ./feature_store/output:/output
    env_file: .env
    environment:
      SCALEWAY_S3_ENDPOINT: ${SCALEWAY_S3_ENDPOINT}
      SCALEWAY_S3_BUCKET: ${SCALEWAY_S3_BUCKET}
      SCALEWAY_ACCESS_KEY: ${SCALEWAY_ACCESS_KEY}
      SCALEWAY_SECRET_KEY: ${SCALEWAY_SECRET_KEY}

  training_v2:
    profiles: [v2]
    build:
      context: .
      dockerfile: training/Dockerfile.process-api
    image: rg.fr-par.scw.cloud/soil-sentinel/training:process-api
    command:
      - python
      - main_v2.py
      - --features
      - /data/features_v2.parquet
      - --model-dir
      - /models
      - --filter-config
      - /config/filter_config.json
      - --reports-dir
      - /reports
      - --model-s3-prefix
      - "models/process_api/"
    volumes:
      - ./feature_store/output:/data:ro
      - ../DSM_WEBAPP/filter_config.json:/config/filter_config.json:ro
      - ../DSM_WEBAPP/models:/models
      - ./training/reports:/reports
    env_file: .env
