services:

  # ---------------------------------------------------------------------------
  # Local S3 emulator — only started with: docker compose --profile local ...
  # MinIO data persists in ./local_storage/ between restarts
  # Console UI: http://localhost:9001  (user: minioadmin / minioadmin)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    profiles: [local]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./local_storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio_init:
    image: minio/mc:latest
    profiles: [local]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/soil-sentinel --ignore-existing;
      echo 'Bucket soil-sentinel ready';
      "
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Job 1 – Remote Sensing Data Acquisition
  # Reads gabri_filters.xlsx, calls Sentinel Hub Statistics API, stores to S3
  # ---------------------------------------------------------------------------
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    image: rg.fr-par.scw.cloud/soil-sentinel/ingestion:latest
    command:
      - python
      - main.py
      - --xlsx
      - /data/gabri_filters.xlsx
      - --evalscript_path
      - sh_statistics/evalscripts/only_scl.js
      - --time_window
      - "60"
      - --workers
      - "8"
    volumes:
      - ./gabri_filters.xlsx:/data/gabri_filters.xlsx:ro
    env_file: .env
    environment:
      SH_CLIENT_ID: ${SH_CLIENT_ID}
      SH_CLIENT_SECRET: ${SH_CLIENT_SECRET}
      SCALEWAY_S3_ENDPOINT: ${SCALEWAY_S3_ENDPOINT}
      SCALEWAY_S3_REGION: ${SCALEWAY_S3_REGION:-fr-par}
      SCALEWAY_S3_BUCKET: ${SCALEWAY_S3_BUCKET}
      SCALEWAY_ACCESS_KEY: ${SCALEWAY_ACCESS_KEY}
      SCALEWAY_SECRET_KEY: ${SCALEWAY_SECRET_KEY}

  # ---------------------------------------------------------------------------
  # Job 2 – Data Enrichment & Feature Consolidation
  # Reads aggregated S3 JSONs, joins with labels, writes feature parquet
  # ---------------------------------------------------------------------------
  feature_store:
    build:
      context: .
      dockerfile: feature_store/Dockerfile
    image: rg.fr-par.scw.cloud/soil-sentinel/feature-store:latest
    command:
      - python
      - main.py
      - --prefix
      - ${FEATURE_STORE_PREFIX:-batch_results/aggregated/}
      - --labels
      - /data/gabri_filters.xlsx
      - --output
      - /output/features.parquet
    volumes:
      - ./gabri_filters.xlsx:/data/gabri_filters.xlsx:ro
      - ./feature_store/output:/output
    env_file: .env
    environment:
      SCALEWAY_S3_ENDPOINT: ${SCALEWAY_S3_ENDPOINT}
      SCALEWAY_S3_REGION: ${SCALEWAY_S3_REGION:-fr-par}
      SCALEWAY_S3_BUCKET: ${SCALEWAY_S3_BUCKET}
      SCALEWAY_ACCESS_KEY: ${SCALEWAY_ACCESS_KEY}
      SCALEWAY_SECRET_KEY: ${SCALEWAY_SECRET_KEY}

  # ---------------------------------------------------------------------------
  # Job 3 – Model Training & Evaluation
  # Loads feature table, trains regressors, writes reports/
  # ---------------------------------------------------------------------------
  training:
    build:
      context: .
      dockerfile: training/Dockerfile
    image: rg.fr-par.scw.cloud/soil-sentinel/training:latest
    command:
      - python
      - main.py
      - --features
      - /data/features.parquet
      - --target
      - ${TARGET:-Clay}
      - --pipeline
      - ${PIPELINE_VERSION:-v2}
      - --reports-dir
      - /reports
    volumes:
      - ./feature_store/output:/data:ro
      - ./training/reports:/reports
    env_file: .env
    environment:
      TARGET: ${TARGET:-Clay}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-v2}
